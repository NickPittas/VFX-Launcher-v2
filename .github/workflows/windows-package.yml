name: Windows portable package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build portable package
        shell: pwsh
        run: ./build_windows.ps1
      - name: Check extracted package with disposable backup preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'artifacts/verification/windows-package'
          New-Item -ItemType Directory -Force $root | Out-Null
          $zip = Get-ChildItem artifacts/releases/*-Windows-x86_64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName (Join-Path $root 'extracted')
          $source = Join-Path $root 'source'
          $destination = Join-Path $root 'destination'
          New-Item -ItemType Directory -Force $source,$destination | Out-Null
          Set-Content (Join-Path $source 'comp_v001.nk') 'Disposable Windows package verification'
          $exe = Join-Path $root 'extracted/vfx-launcher.exe'
          $arguments = 'backup --source "{0}" --destination "{1}" --dry-run --data-dir "{2}"' -f $source,$destination,(Join-Path $root 'data')
          $process = Start-Process $exe -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $root 'preview.out') -RedirectStandardError (Join-Path $root 'preview.err')
          $handle = $process.Handle
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Backup preview timed out' }
          Get-Content (Join-Path $root 'preview.out')
          Get-Content (Join-Path $root 'preview.err')
          if ($process.ExitCode -ne 0) { throw 'Backup preview failed' }
          if (@(Get-ChildItem $destination -Recurse).Count -ne 0) { throw 'Dry-run changed destination' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-portable-package
          path: |
            artifacts/releases/*-Windows-x86_64.zip*
            artifacts/windows-package/*.out
            artifacts/windows-package/*.err
            artifacts/verification/windows-package/*.out
            artifacts/verification/windows-package/*.err
          if-no-files-found: error

[package]
name = "vfx-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "VFX Launcher desktop application (Rust/egui migration)"
publish = false

[lib]
name = "vfx_launcher"
path = "src/lib.rs"

[[bin]]
name = "vfx-launcher"
path = "src/main.rs"

[dependencies]
# glow instead of the default wgpu renderer: smaller dependency surface and the
# renderer the plan targets for Linux/Windows. wayland+x11 for Linux sessions.
eframe = { version = "=0.37.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "system_fonts",
    "wayland",
    "x11",
] }
egui_extras = { version = "=0.37.0", default-features = false }
# F2 storage/config. `bundled` ships the SQLite amalgamation so Linux and the
# Windows target do not depend on a system sqlite3 install or link flags.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Windows-only: drive-type classification for the catalog location check
# (`GetDriveTypeW`) and native write-through file replacement for config saves
# (`ReplaceFileW`/`MoveFileExW`). Both come from the same feature module, so one
# target-specific dependency covers them; Linux builds do not compile it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
[package]
name = "vfx-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "VFX Launcher desktop application (Rust/egui migration)"
publish = false

[lib]
name = "vfx_launcher"
path = "src/lib.rs"

[[bin]]
name = "vfx-launcher"
path = "src/main.rs"

[dependencies]
# glow instead of the default wgpu renderer: smaller dependency surface and the
# renderer the plan targets for Linux/Windows. wayland+x11 for Linux sessions.
eframe = { version = "=0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "system_fonts",
    "wayland",
    "x11",
] }
egui_extras = { version = "=0.37.0", default-features = false }
# F2 storage/config. `bundled` ships the SQLite amalgamation so Linux and the
# Windows target do not depend on a system sqlite3 install or link flags.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# P2 tokenizer for the legacy Linux Nuke launch command. Used only for
# `shlex::split`, the POSIX-shell word splitting the legacy `shlex.split` did —
# not a hand-written quote parser, and never a shell.
shlex = "=2.0.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

# U1 "Add existing folder": native folder picker, always on a worker thread, never
# in a frame. Linux selects rfd's GTK3 backend because the desktop portal has no
# fallback: a portal provider that never answers the FileChooser request (flea 0.4
# left one pending for the whole session here) hangs the picker. The GTK3 backend
# initializes GTK on a thread rfd owns and blocks only the asking worker, so no
# portal, service or desktop setting is changed. It links libgtk3 at runtime, so
# packaging must ship GTK3 3.24.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
rustix = { version = "=1.1.6", features = ["fs"] }

# Windows and macOS use rfd's native dialogs, which need no feature flag;
# `default-features = false` drops the Linux-only portal and wayland features.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

# Windows-only: drive-type classification for the catalog location check
# (`GetDriveTypeW`) and native write-through file replacement for config saves
# (`ReplaceFileW`/`MoveFileExW`). Both come from the same feature module, so one
# target-specific dependency covers them; Linux builds do not compile it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
